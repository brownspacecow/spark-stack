model_list:
  - model_name: nemotron-3.5-super-vl
    litellm_params:
      model: openai/nemotron-3.5-super-vl
      api_base: http://vllm:8000/v1
      api_key: none

  - model_name: local                      # backwards-compatible alias
    litellm_params:
      model: openai/nemotron-3.5-super-vl
      api_base: http://vllm:8000/v1
      api_key: none

litellm_settings:
  callbacks: ["prometheus"]                # exposes /metrics on :4000 (verify which metrics your version includes)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
