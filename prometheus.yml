global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm-key.txt
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
